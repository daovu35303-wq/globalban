[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globalban"
version = "0.1.0"
description = "Local defensive SSH and Windows security event monitor"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
globalban = "globalban.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]